<template>
    <lightning-card title="Text to PDF">
        <div class="main-layout">
            <!-- LEFT: PDF preview -->
            <div class="canvas-container">
                <div class="a4-preview">
                    <template for:each={textboxElements} for:item="box">
                        <div key={box.id}
                             class="pdf-box"
                             style={box.style}>
                            {box.text}
                        </div>
                    </template>
                </div>
            </div>

            <!-- RIGHT: Editor (custom inputs + 2-column layout) -->
            <div class="editor-container">
                <textarea class="custom-textarea" 
                          placeholder="Enter text..." 
                          value={textValue}
                          oninput={handleTextChange}></textarea>

                <button class="custom-button" onclick={generatePdf}>
                    Download PDF
                </button>

                <div class="field-grid">
                    <div class="field-pair">
                        <label>Horizontal Padding (pt)</label>
                        <input type="number" value={paddingHorizontal} onchange={handleHorizontalPaddingChange} />
                    </div>

                    <div class="field-pair">
                        <label>Vertical Padding (pt)</label>
                        <input type="number" value={paddingVertical} onchange={handleVerticalPaddingChange} />
                    </div>

                    <div class="field-pair">
                        <label>Textbox Background Color</label>
                        <input type="color" value={boxColor} onchange={handleBoxColorChange} />
                    </div>

                    <div class="field-pair">
                        <label>Text Color</label>
                        <input type="color" value={textColor} onchange={handleTextColorChange} />
                    </div>

                    <div class="field-pair" style="display: flex;flex-direction: row;align-items: center;justify-content: space-between;">
                        <label>Show Border</label>
                        <input type="checkbox" checked={showBorder} onchange={handleBorderToggle} />
                    </div>

                    <div class="field-pair">
                        <label>Border Width (pt)</label>
                        <input type="number" value={borderWidth} onchange={handleBorderWidthChange} />
                    </div>

                    <div class="field-pair">
                        <label>Border Color</label>
                        <input type="color" value={borderColor} onchange={handleBorderColorChange} />
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
