<template>
    <button onclick={handlePOC}> POC button </button>
    <!-- lwc:render-mode="light" -->
    <lightning-card title="Text to PDF">
        
        <!-- preview window -->
        <div>
            <template if:true={textboxElements}>
                <div class="preview-container">
                    <template for:each={textboxElements} for:item="box">
                        <div key={box.id}
                            class="preview-box"
                            style={box.style}>
                            {box.text}
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- editor -->
        <div class="slds-m-around_medium">
            <div>
                <lightning-textarea 
                    label="Enter Text" 
                    value={textValue} 
                    onchange={handleTextChange}>
                </lightning-textarea>

                <lightning-button 
                    label="Download PDF" 
                    variant="brand" 
                    class="slds-m-top_medium" 
                    onclick={generatePdf}>
                </lightning-button>
                
                <lightning-input
                    label="Horizontal Padding (pt)"
                    type="number"
                    value={paddingHorizontal}
                    onchange={handleHorizontalPaddingChange}>
                </lightning-input>

                <lightning-input
                    label="Vertical Padding (pt)"
                    type="number"
                    value={paddingVertical}
                    onchange={handleVerticalPaddingChange}>
                </lightning-input>

                <lightning-input
                    type="color"
                    label="Textbox Background Color"
                    value={boxColor}
                    onchange={handleBoxColorChange}>
                </lightning-input>

                <lightning-input
                    type="color"
                    label="Text Color"
                    value={textColor}
                    onchange={handleTextColorChange}>
                </lightning-input>
            </div>
        </div>
    </lightning-card>
</template>
