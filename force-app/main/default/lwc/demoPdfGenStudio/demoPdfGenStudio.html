<template>
    <button onclick={handlePOC}> POC button </button>
    <!-- lwc:render-mode="light" -->
    <lightning-card title="Text to PDF">
        <div class="slds-m-around_medium">
            <lightning-textarea 
                label="Enter Text" 
                value={textValue} 
                onchange={handleTextChange}>
            </lightning-textarea>
            <lightning-button 
                label="Download PDF" 
                variant="brand" 
                class="slds-m-top_medium" 
                onclick={generatePdf}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
