<template>
    <button onclick={handlePOC}> POC button </button>
    <!-- lwc:render-mode="light" -->
    <lightning-card title="Text to PDF">
        <div class="slds-m-around_medium">
            <lightning-textarea 
                label="Enter Text" 
                value={textValue} 
                onchange={handleTextChange}>
            </lightning-textarea>
            <lightning-button 
                label="Download PDF" 
                variant="brand" 
                class="slds-m-top_medium" 
                onclick={generatePdf}>
            </lightning-button>
            <div class="pdf-content slds-box"></div>
            <template lwc:if={jsPdfInitialized} lwc:dom="manual">
                <div class="printPreviewDiv" lwc:ref="printPreviewDiv">
                    Take screenshot of this div.
                </div>
                
                <div id="screenshotcanvas" class="screenshotcanvas">
                    <canvas class="my_canvas_id slds-hide">
                    
                    </canvas>
                </div>
                
                <img src={imgsrc} class="lightense"/>
                
                <button onclick={printDiv}> Take Screenshot</button>
            </template>
            <!-- lwc:dom="manual" -->
        </div>
    </lightning-card>
</template>
